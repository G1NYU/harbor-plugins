name: Trial Source Report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/trial-report.trigger'

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Plugins & Manifests
        run: npm run build

      - name: Test trial sources
        run: npm run trial-report

      - name: Save report to the repo
        continue-on-error: true
        run: |
          mkdir -p reports
          cp trial-report.md reports/trial-report.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/trial-report.md
          if git diff --cached --quiet; then
            echo "Report unchanged"
          else
            git commit -m "chore(reports): trial source report [skip ci]"
            git push origin HEAD:main
          fi

      - name: Post report as an issue (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Trial source report $(date -u +'%Y-%m-%d %H:%M') UTC" --body-file trial-report.md
